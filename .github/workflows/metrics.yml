name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vitorforny04
          base: "" # Remove o header e informações padrão do GitHub
          plugin_languages: yes # Ativa o card de linguagens
          plugin_languages_details: percentage # Mostra porcentagem
          plugin_languages_limit: 8 # Quantidade máxima de linguagens exibidas
